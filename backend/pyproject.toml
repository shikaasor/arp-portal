[project]
name = "arp-api"
version = "1.0.0"
description = "Arewa Revival Project empowerment portal API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
