# Netlify: connect the repo and these settings are picked up automatically.
# Set NEXT_PUBLIC_* variables in Site configuration → Environment variables.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # Skip deploys when nothing in the frontend changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime is installed automatically for Next.js sites.
