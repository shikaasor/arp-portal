# Render Blueprint for the FastAPI backend (Dashboard → New → Blueprint → pick this repo).
# Secrets marked `sync: false` are prompted for on first deploy and never stored in Git.
services:
  - type: web
    name: arp-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: applicant-documents
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
